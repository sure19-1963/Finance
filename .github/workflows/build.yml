name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFinance-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk

      # Builds from main are also published as the "latest" release, so the APK
      # can be downloaded straight to the phone without unzipping.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyFinance.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MyFinance.apk --title "Latest build" --notes "Built from ${GITHUB_SHA::7}. Download MyFinance.apk on your phone to install." --prerelease
